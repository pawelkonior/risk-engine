[project]
name = "application-api"
version = "0.1.0"
description = "FastAPI and LangGraph backend with SQL, dual graphs, vectors, and Vercel deployment"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "aiosqlite==0.22.1",
    "psycopg[binary]==3.3.9",
    "fastapi==0.163.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "python-json-logger==4.2.0",
    "sqlalchemy[asyncio]==2.1.9",
    "uvicorn[standard]==0.54.0",
    "langgraph==1.2.22",
    "neo4j==6.4.1",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "tox==4.67.13",
    "tox-uv==1.37.7",
]
docs = [
    "furo==2025.12.19",
    "sphinx==9.2.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 90
precision = 2
show_missing = true
skip_covered = true

[tool.pyright]
exclude = ["docs/_build"]
include = ["src", "tests", "migrations", "scripts", "index.py"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.vercel]
entrypoint = "index:app"
