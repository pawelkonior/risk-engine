name: application-api

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    init: true
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: local
      APP_DOCS_ENABLED: "true"
      APP_DATABASE_URL: postgresql+psycopg://app:app-local-only@postgres:5432/app
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres18-data:
